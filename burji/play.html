<style>
/* One-screen arcade: full-bleed canvas world that changes every level, floating HUD, glass cards and sheets. Single deliberate night look. */
:root{
  --sky:#120E2A;
  --ink:#F6F2FF;
  --muted:#BDB6DD;
  --glass:rgba(18,14,42,.82);
  --line:rgba(246,242,255,.16);
  --accent:#FFC94D;
  --accent-ink:#2A1A00;
  --accent-edge:#C9921A;
  --gem:#8FE9FF;
  --gold:#FFC94D; --silver:#D5DBE8; --bronze:#E09A63;
  --display:"Lalezar","Vazirmatn",system-ui,sans-serif;
  --body:"Vazirmatn",system-ui,-apple-system,"Segoe UI",sans-serif;
  --num:"Lalezar",system-ui,sans-serif;
  color-scheme:dark;
}
:root[lang="ku"]{--display:"Vazirmatn",system-ui,sans-serif}
:root[lang="ku"] .disp{font-weight:800}
:root[lang="ur"]{--display:"Vazirmatn",system-ui,sans-serif}
:root[lang="ur"] .disp{font-weight:800}
html,body{height:100%}
[hidden]{display:none!important}
body{
  background:var(--sky);color:var(--ink);font-family:var(--body);
  overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;
}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.gem{width:18px;height:18px;flex:none;display:inline-block;vertical-align:middle}

.hud{
  position:fixed;left:0;right:0;top:0;pointer-events:none;text-align:center;
  padding-top:calc(env(safe-area-inset-top,0px) + 18px);
  padding-left:max(72px,env(safe-area-inset-left,0px));
  padding-right:max(72px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;align-items:center;gap:2px;
}
.score{font-family:var(--num);font-size:clamp(60px,15vw,96px);line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 4px 0 rgba(0,0,0,.25)}
.score.bump{animation:pop .25s ease-out}
@keyframes pop{40%{transform:scale(1.14)}}
.best{font-size:14px;color:var(--muted)}
.wchip{margin-top:6px;font-size:12.5px;background:rgba(18,14,42,.5);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.toast{margin-top:8px;font-family:var(--display);font-size:26px;color:var(--accent);opacity:0;transform:translateY(6px) scale(.9);transition:opacity .2s,transform .2s;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.toast.on{opacity:1;transform:none}
.toast.big{font-size:34px;color:#fff}

.tools{position:fixed;z-index:6;top:calc(env(safe-area-inset-top,0px) + 14px);left:max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px}
:root[dir="rtl"] .tools{left:auto;right:max(14px,env(safe-area-inset-right,0px))}
.tool{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--glass);color:var(--ink);display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:0}
.tool svg,.navb svg,.ach .ic svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tool svg{width:20px;height:20px}
.tool .slash{display:none;stroke:var(--accent)}
.tool.off{color:var(--muted)}
.tool.off .slash{display:inline}
.tool.gold{color:var(--accent)}
:is(.tool,.chip,.btn,.btn2,.sw,.link,.navb,.daily,.tab,.ibtn,.item):focus-visible{outline:3px solid var(--ink);outline-offset:3px}

.banner{position:fixed;z-index:7;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 168px);text-align:center;pointer-events:none;display:flex;flex-direction:column;gap:6px;align-items:center;opacity:0;transform:scale(.9);transition:opacity .35s,transform .35s;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.banner.on{opacity:1;transform:none}
.banner .lv{font-size:14px;letter-spacing:.06em;color:var(--accent);font-weight:800}
.banner .nm{font-family:var(--display);font-size:clamp(34px,9.5vw,54px);line-height:1.1;text-shadow:0 3px 0 rgba(0,0,0,.35);text-wrap:balance}
.banner .rl{font-size:15px;background:rgba(18,14,42,.6);border:1px solid var(--line);border-radius:999px;padding:5px 14px;max-width:100%}

.pop{position:fixed;z-index:8;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translate(-50%,160%);transition:transform .35s;display:flex;align-items:center;gap:10px;background:var(--glass);border:1px solid rgba(255,201,77,.6);border-radius:16px;padding:10px 16px;width:max-content;max-width:calc(100% - 32px);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.pop.on{transform:translate(-50%,0)}
.pop .t1{font-size:12px;color:var(--accent);font-weight:800}
.pop .t2{font-size:15px;font-weight:700}
.pop .rw{display:flex;align-items:center;gap:4px;font-family:var(--num);font-size:20px;color:var(--gem)}

.overlay{position:fixed;z-index:5;inset:0;display:grid;place-items:end center;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 20px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(to bottom,transparent 40%,rgba(8,6,20,.62))}
.card,.panel{
  width:min(100%,390px);background:var(--glass);border:1px solid var(--line);border-radius:24px;padding:18px 16px 16px;text-align:center;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;flex-direction:column;gap:11px;
  max-height:calc(100vh - 40px);max-height:calc(100dvh - 40px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;
}
.card h1,.panel h2{margin:0;font-family:var(--display);font-weight:400;font-size:38px;line-height:1.15;text-wrap:balance}
.panel h2{font-size:30px}
.card p{margin:0;color:var(--muted);font-size:14.5px;line-height:1.65}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 10px;font-family:var(--num);font-size:20px;line-height:1;font-variant-numeric:tabular-nums;color:var(--gem)}
.who{display:inline-flex;align-items:center;gap:6px;min-width:0;flex:0 1 auto;border:1px solid var(--line);border-radius:999px;padding:3px 4px 3px 10px;font-size:14px}
.who bdi{max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.dot{width:11px;height:11px;border-radius:50%;flex:none;background:currentColor;box-shadow:0 0 8px currentColor}
.link{appearance:none;background:none;border:0;color:var(--accent);font:700 13px var(--body);cursor:pointer;padding:5px 8px;flex:none}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{border:1px solid var(--line);border-radius:14px;padding:10px 8px}
.stat b{display:block;font-family:var(--num);font-weight:400;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.btn{appearance:none;border:0;border-radius:999px;padding:13px 20px;background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-size:22px;cursor:pointer;box-shadow:0 5px 0 var(--accent-edge);transition:transform .08s,box-shadow .08s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--accent-edge)}
.btn:disabled{opacity:.6;cursor:default}
.btn.revive{background:linear-gradient(#A8F0FF,#5CC9EC);color:#062B3A;box-shadow:0 5px 0 #2A8FB5}
.btn.revive:active{box-shadow:0 1px 0 #2A8FB5}
.btn.revive .n{font-family:var(--num)}
/* on the light-blue button the gem is drawn dark so it doesn't melt into the background */
.btn.revive .gem{width:22px;height:22px;filter:drop-shadow(0 1px 0 rgba(255,255,255,.6))}
.btn.revive .gem path:first-child{fill:#0B4F6E}
.btn.revive .gem path+path{stroke:#9FEBFF;stroke-width:1.5}
.btn2{appearance:none;background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:10px 12px;font:500 14px var(--body);cursor:pointer}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.row3 .btn2{font-size:12.5px;padding:9px 4px;line-height:1.3}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.daily{appearance:none;border:1.5px solid var(--accent);background:rgba(255,201,77,.08);color:var(--ink);border-radius:16px;padding:9px 14px;cursor:pointer;display:flex;flex-direction:column;gap:1px;align-items:center;font:800 16px var(--body)}
.daily small{font-weight:500;font-size:12.5px;color:var(--muted)}
.nav3{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.nav3 .navb{font-size:12px;line-height:1.3}
.navb.free{color:var(--gem);border-color:rgba(143,233,255,.4)}
.navb.free .sub{color:var(--gem)}
.pl{width:16px;height:16px;flex:none}
.revrow{display:flex;flex-wrap:wrap;gap:8px}
.revrow .btn{flex:1 1 150px;font-size:18px;padding:12px 10px;white-space:nowrap}
/* narrow phones: one continue button per line, so a long label never wraps around its icon */
@media (max-width:430px){.revrow .btn{flex-basis:100%;padding:10px}}
.btn,.btn2{text-wrap:balance}
#vidSave{font-size:17px;line-height:1.25}
/* the player row on the menu: name, @username and titles shrink first, the edit button always stays visible */
#playerRow{max-width:100%;overflow:hidden}
#playerRow .hdl,#playerRow .ttl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:0 1 auto}
#playerRow #playerBtn{flex:0 1 auto;min-width:0;max-width:58%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toprow{min-width:0}.toprow>.who{min-width:0}
#playerRow bdi{flex:0 1 auto;min-width:3.2em}#playerRow .hdl{flex-shrink:2}
/* phones: titles are shown on the profile and the leaderboard, the top bar keeps only the name, @username and the button */
@media (max-width:430px){#playerRow .ttl{display:none}}

.dbl{display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--gem);border-color:rgba(143,233,255,.45)}
.adbox{border-radius:18px;padding:30px 16px 18px;background:linear-gradient(135deg,#3B2A7A,#7A3B8F 55%,#E0785A);display:flex;flex-direction:column;gap:10px;align-items:center;position:relative;overflow:hidden}
.adbox .tag{position:absolute;top:10px;inset-inline-start:10px;font-size:11px;font-weight:800;background:rgba(0,0,0,.35);border-radius:6px;padding:2px 8px}
.adbox canvas{width:200px;height:110px;max-width:100%}
.adbox .promo{font-family:var(--display);font-size:26px;line-height:1.25;text-wrap:balance}
.adbar{width:100%;height:6px;border-radius:999px;background:rgba(255,255,255,.22);overflow:hidden}
.adbar i{display:block;height:100%;width:0;background:#fff}
.savest{font-size:13px;line-height:1.6;margin:0;padding:10px 12px;border-radius:12px;background:rgba(246,242,255,.06)}
.gbtn{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px;background:#fff;color:#1f1f1f}
.dellink{display:block;margin:14px auto 0;background:none;border:0;padding:6px;font:inherit;font-size:13px;color:#FF9A8B;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.btn.delyes{background:linear-gradient(#FF8A7A,#E5533F);color:#2A0700;box-shadow:0 5px 0 #A8321F}
.navb{appearance:none;border:1px solid var(--line);background:rgba(246,242,255,.04);color:var(--ink);border-radius:14px;padding:9px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;font:500 13px var(--body);cursor:pointer}
.navb svg{width:22px;height:22px}
.navb .sub{font-size:11px;color:var(--muted);font-family:var(--num);font-variant-numeric:tabular-nums}
.hint{font-size:12px;color:var(--muted)}
.hint.err{color:#FF9A8B}
.hint.ok{color:#9BE6A8}
.new{color:var(--accent);font-weight:700}
.gline{display:flex;justify-content:center;align-items:center;gap:6px;font-family:var(--num);font-size:26px;color:var(--gem);line-height:1}
.gline .gem{width:22px;height:22px}
.wline{font-size:13px;color:var(--muted);margin-top:-4px}
.rankline{font-size:15px}
.rankline b{font-family:var(--num);font-weight:400;font-size:22px;color:var(--accent)}

.sheet{position:fixed;z-index:10;inset:0;display:grid;place-items:center;background:rgba(8,6,20,.58);padding-top:calc(env(safe-area-inset-top,0px) + 14px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:rgba(246,242,255,.06);border-radius:999px;padding:4px}
.tabs.t3{grid-template-columns:repeat(3,1fr)}
.tabs.t4{grid-template-columns:repeat(4,1fr)}
#overOv:not(.armed) .card{pointer-events:none}
.daily.live{border-color:#7FE3FF;background:rgba(127,227,255,.08)}
.daily.grp{border-color:#3DDC97;background:rgba(61,220,151,.08)}
#grpRows li{cursor:pointer}
#grpVName{text-align:center;font-size:20px}
#grpBtn[hidden]{display:none}
.kpi{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;text-align:start;padding:8px 10px;border-radius:12px;background:rgba(246,242,255,.04);margin-bottom:4px}
.kpi b{font-family:var(--num);font-size:22px;font-variant-numeric:tabular-nums}
.kpi small{grid-column:1/-1;font-size:11.5px;color:var(--muted)}
.kpi.good b{color:#3DDC97}.kpi.bad b{color:#FF8F8F}
.dbars{display:flex;align-items:flex-end;gap:3px;height:70px;margin:8px 0 2px;direction:ltr}
.dbars i{flex:1;background:rgba(127,227,255,.55);border-radius:3px 3px 0 0;min-height:2px}
.dbars i:last-child{background:#7FE3FF}
.daily.live small{color:#BFF2FF}
.livehud{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;justify-content:center}
.lh{display:inline-flex;align-items:center;gap:6px;background:rgba(18,14,42,.62);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px}
.lh .n{font-family:var(--num);font-size:18px;line-height:1;font-variant-numeric:tabular-nums}
.lh small{font-size:11px;color:var(--muted)}
.lh.lead{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.lh bdi{max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.invite{position:fixed;z-index:12;left:50%;top:calc(env(safe-area-inset-top,0px) + 150px);transform:translateX(-50%);width:min(calc(100% - 32px),360px);background:var(--glass);border:1px solid #7FE3FF;border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;text-align:center;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.invite b{font-size:15px}
.ibtn.ghost2{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.hrow{display:flex;align-items:center;gap:6px}
.hrow .at{font:700 20px var(--num);color:var(--muted)}
.hrow input{flex:1;min-width:0;direction:ltr}
.hdl{opacity:.7;font-size:11px;direction:ltr;unicode-bidi:isolate;margin-inline-start:4px;font-weight:500}
.hbig{font:400 22px var(--num);color:var(--accent);margin:6px 0 0}
#findRes:empty{display:none}
#findRes li.none{display:block;text-align:center;color:var(--muted);font-size:14px}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qgrid .chip{padding:12px 6px;font-size:15px}
.qbub{border-color:#FFC94D}
.gchat{margin-top:14px;display:flex;flex-direction:column;gap:8px}
#gChatList{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:260px;overflow-y:auto}
#gChatList li{background:rgba(246,242,255,.06);border-radius:12px;padding:8px 10px;font-size:14px;line-height:1.5;word-break:break-word}
#gChatList li.me{background:rgba(127,227,255,.12)}
#gChatList .cwho{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
#gChatList .cwho b{color:var(--ink);font-weight:700}
#gChatList .cwho .more{margin-inline-start:auto;background:none;border:0;color:var(--muted);font-size:16px;cursor:pointer;padding:0 4px}
#gChatList .acts{display:flex;gap:6px;margin-top:6px}
#dmChatList{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:46vh;min-height:120px;overflow-y:auto}
#dmChatList li{background:rgba(246,242,255,.06);border-radius:12px;padding:8px 10px;font-size:14px;line-height:1.5;word-break:break-word;max-width:86%;align-self:flex-start}
#dmChatList li.me{background:rgba(127,227,255,.14);align-self:flex-end}
#dmChatList .cwho{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
#dmChatList .cwho .more{margin-inline-start:auto;background:none;border:0;color:var(--muted);font-size:16px;cursor:pointer;padding:0 4px}
#dmChatList .acts{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.daily.dm{border-color:#FF8FB8;background:rgba(255,143,184,.08)}
.duo{display:flex;gap:8px}.duo>.daily{flex:1 1 0;min-width:0}
.duo .daily small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.daily.mis{border-color:#7FE3A0;background:rgba(127,227,160,.09)}.daily.mis.ready{animation:misGlow 1.6s ease-in-out infinite}.daily.mis.ready small{color:#7FE3A0;font-weight:800}
@keyframes misGlow{50%{box-shadow:0 0 0 3px rgba(127,227,160,.25)}}
@media (prefers-reduced-motion:reduce){.daily.mis.ready{animation:none}}
.daily.lgb{border-color:#FFB86B;background:rgba(255,184,107,.09)}.daily.lgb small{color:#FFD6A3;font-weight:700}
.mbar{height:7px;border-radius:9px;background:rgba(246,242,255,.1);overflow:hidden;margin-top:7px}.mbar i{display:block;height:100%;background:linear-gradient(90deg,#7FE3A0,#FFC94D);border-radius:inherit}
.mrow .pn{display:block;margin-top:4px;font-size:12px;color:var(--muted);font-weight:700}
.mrow .okm{font-size:22px;color:#7FE3A0;padding:0 8px}
#misChestNote{text-align:center;margin:2px 0 0}
.ladder{display:flex;justify-content:center;gap:10px;font-size:24px;margin:4px 0}.ladder span{opacity:.32;filter:grayscale(1);transition:transform .2s}.ladder span.on{opacity:1;filter:none;transform:scale(1.3)}
